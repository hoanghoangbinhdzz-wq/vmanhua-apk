name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android -keypass android

      - name: Patch manifest
        run: |
          python3 - << 'EOF'
          import json, os
          ks = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'
          with open('twa-manifest.json') as f:
              m = json.load(f)
          m['signingKey'] = {'path': ks, 'alias': 'android'}
          # bubblewrap mới dùng startUrl, file cũ dùng launchUrl
          if 'startUrl' not in m:
              m['startUrl'] = m.get('launchUrl', '/')
          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print('host:', m.get('host'))
          print('startUrl:', m.get('startUrl'))
          print('signingKey:', m.get('signingKey'))
          EOF

      - name: Write build script
        run: |
          cat > build.py << 'PYEOF'
          import pexpect, sys, os
          KS = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'
          child = pexpect.spawn(
            'bubblewrap build --skipPwaValidation',
            timeout=300, encoding='utf-8'
          )
          child.logfile = sys.stdout
          P = [
            'regenerate',
            r'\[Y/n\]',
            r'\(Y/n\)',
            'Key Store Location',
            'Key Store Password',
            'Key Alias',
            'Key Password',
            pexpect.EOF,
            pexpect.TIMEOUT,
          ]
          while True:
            i = child.expect(P, timeout=300)
            print(f'\n[match:{i}]\n', flush=True)
            if   i == 0: child.sendline('y')
            elif i in (1, 2): child.sendline('y')
            elif i == 3: child.sendline(KS)
            elif i == 4: child.sendline('android')
            elif i == 5: child.sendline('android')
            elif i == 6: child.sendline('android')
            elif i == 7: break
            elif i == 8:
              child.terminate(force=True)
              break
          child.close()
          sys.exit(child.exitstatus or 0)
          PYEOF

      - name: Build APK
        run: |
          pip install pexpect --break-system-packages
          python3 build.py

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: "**/*.apk"
