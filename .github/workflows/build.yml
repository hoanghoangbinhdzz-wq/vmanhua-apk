name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android \
            -keypass android

      - name: Build APK
        run: |
          sudo apt-get install -y expect
          expect << 'EXPECT'
          set timeout 300
          spawn bubblewrap build --skipPwaValidation
          expect {
            "regenerate your project" { send "y\r"; exp_continue }
            -re "(Y/n)" { send "n\r"; exp_continue }
            "Password for the Key Store:" { send "android\r"; exp_continue }
            "Password for alias" { send "android\r"; exp_continue }
            eof
          }
          EXPECT

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: "**/*.apk"            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android \
            -keypass android

      - name: Build APK
        run: |
          sudo apt-get install -y expect
          expect << 'EXPECT'
          set timeout 300
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re "(Y/n)" { send "n\r"; exp_continue }
            "Password for the Key Store:" { send "android\r"; exp_continue }
            "Password for alias" { send "android\r"; exp_continue }
            eof
          }
          EXPECT

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: "**/*.apk"
