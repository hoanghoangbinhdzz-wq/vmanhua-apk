name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tunnel_url:
        description: 'URL tunnel (không có https://)'
        required: false
        default: 'placeholder.trycloudflare.com'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUNNEL_URL: ${{ secrets.TUNNEL_URL || github.event.inputs.tunnel_url || 'placeholder.trycloudflare.com' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android -keypass android

      - name: Show SHA256 Fingerprint
        run: |
          echo "══════════════════════════════════════"
          echo " SHA256 — paste vào app.py"
          echo "══════════════════════════════════════"
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -storepass android \
            | grep "SHA256:" | sed 's/.*SHA256:/SHA256:/'
          echo "══════════════════════════════════════"

      - name: Prepare icon (download hoặc tạo placeholder)
        run: |
          mkdir -p /tmp/iconserver

          # Lấy URL icon hiện tại từ manifest (trước khi patch host)
          ICON_URL=$(python3 -c "
          import json
          with open('twa-manifest.json') as f:
              m = json.load(f)
          icons = m.get('icons', [])
          url = next((i['src'] for i in icons if '512' in i.get('sizes','')),
                     next((i['src'] for i in icons), ''))
          print(url)
          " 2>/dev/null || echo "")

          echo "Icon URL gốc: $ICON_URL"

          if [ -n "$ICON_URL" ] && curl -sf --connect-timeout 8 --max-time 15 "$ICON_URL" -o /tmp/iconserver/icon-512.png 2>/dev/null; then
            echo "Icon tải thành công từ URL gốc"
          else
            echo "Tunnel không khả dụng — tạo icon placeholder..."
            python3 -c "
          import struct, zlib

          def make_png(w, h, r, g, b):
              raw = b''.join(bytes([0]) + bytes([r, g, b] * w) for _ in range(h))
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw, 1))
              iend = chunk(b'IEND', b'')
              return b'\x89PNG\r\n\x1a\n' + ihdr + idat + iend

          with open('/tmp/iconserver/icon-512.png', 'wb') as f:
              f.write(make_png(512, 512, 79, 70, 229))
          print('Placeholder icon created (512x512 purple)')
          "
          fi

          # Khởi động HTTP server local để serve icon
          cd /tmp/iconserver
          python3 -m http.server 8899 &
          sleep 2
          echo "Icon server status: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8899/icon-512.png)"

      - name: Patch twa-manifest.json
        run: |
          python3 - << 'EOF'
          import json, os
          ks   = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'
          host = os.environ.get('TUNNEL_URL', 'placeholder.trycloudflare.com')
          with open('twa-manifest.json') as f:
              m = json.load(f)
          m['host']           = host
          m['webManifestUrl'] = f'https://{host}/manifest.json'
          m['fullScopeUrl']   = f'https://{host}/'
          m['signingKey']     = {'path': ks, 'alias': 'android'}
          m['appVersionCode'] = 1
          m['appVersionName'] = '1.0.0'
          if 'startUrl' not in m:
              m['startUrl'] = m.get('launchUrl', '/')

          # Patch icon URLs → local server (tránh lỗi 503 từ tunnel cũ)
          for icon in m.get('icons', []):
              icon['src'] = 'http://localhost:8899/icon-512.png'
          for shortcut in m.get('shortcuts', []):
              for icon in shortcut.get('icons', []):
                  icon['src'] = 'http://localhost:8899/icon-512.png'

          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print(f"host: {host}")
          print(f"startUrl: {m['startUrl']}")
          print(f"version: {m['appVersionName']} ({m['appVersionCode']})")
          print(f"icons: patched to local server")
          EOF

      - name: Write build script
        run: |
          cat > build.py << 'PYEOF'
          import pexpect, sys, os

          KS = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'

          child = pexpect.spawn(
              'bubblewrap build --skipPwaValidation',
              timeout=60, encoding='utf-8'
          )
          child.logfile = sys.stdout

          PATTERNS = [
              'regenerate',
              r'\[Y/n\]',
              r'\(Y/n\)',
              r'\(y/N\)',
              'Key Store Location',
              'Key Store Password',
              'Key Alias',
              'Key Password',
              r'[Vv]ersion[Nn]ame',
              r'[Vv]ersion[Cc]ode',
              'BUILD SUCCESSFUL',
              'BUILD FAILED',
              pexpect.EOF,
              pexpect.TIMEOUT,
          ]

          print('\n[Phase 1: answering prompts]\n', flush=True)
          while True:
              i = child.expect(PATTERNS, timeout=60)
              print(f'\n[match:{i}]\n', flush=True)

              if   i == 0: child.sendline('y')
              elif i == 1: child.sendline('y')
              elif i == 2: child.sendline('y')
              elif i == 3: child.sendline('n')
              elif i == 4: child.sendline(KS)
              elif i == 5: child.sendline('android')
              elif i == 6: child.sendline('android')
              elif i == 7: child.sendline('android')
              elif i == 8: child.sendline('1.0.0')
              elif i == 9: child.sendline('1')
              elif i == 10:
                  print('BUILD SUCCESSFUL (phase 1)', flush=True); break
              elif i == 11:
                  print('BUILD FAILED (phase 1)', flush=True); break
              elif i == 12:
                  print('EOF received', flush=True); break
              elif i == 13:
                  print('[switching to Phase 2]', flush=True); break

          if child.isalive():
              print('\n[Phase 2: waiting for Gradle, max 10 min]\n', flush=True)
              try:
                  idx = child.expect(
                      ['BUILD SUCCESSFUL', 'BUILD FAILED', pexpect.EOF],
                      timeout=600
                  )
                  labels = ['BUILD SUCCESSFUL', 'BUILD FAILED', 'EOF']
                  print(labels[idx], flush=True)
              except pexpect.TIMEOUT:
                  print('Gradle timeout', flush=True)
                  child.terminate(force=True)

          child.close()
          rc = child.exitstatus
          if rc is None:
              rc = 1
          print(f'\nExit code: {rc}\n', flush=True)
          sys.exit(rc)
          PYEOF

      - name: Build APK (với retry nếu lỗi mạng)
        run: |
          pip install pexpect --break-system-packages
          for attempt in 1 2 3; do
            echo "Attempt $attempt / 3"
            python3 build.py && break
            if [ $attempt -lt 3 ]; then
              echo "Thất bại, thử lại sau 30s..."
              sleep 30
            else
              echo "Đã thử 3 lần, vẫn lỗi."
              exit 1
            fi
          done

      - name: Find APK
        if: always()
        run: |
          echo "=== Tìm APK ==="
          find . -name "*.apk" 2>/dev/null | tee /tmp/apk_list.txt
          if [ -s /tmp/apk_list.txt ]; then
            echo "Tìm thấy APK!"
          else
            echo "Không thấy APK"
            find . -name "gradlew" -o -name "*.aab" 2>/dev/null | head -20
            ls -la app/build/outputs/ 2>/dev/null || true
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
