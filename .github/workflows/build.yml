name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g @bubblewrap/cli
      - run: echo "N" | bubblewrap init --manifest https://c83ab48eabfa07.lhr.life/static/manifest.json
      - run: echo "N" | bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: "*.apk"
