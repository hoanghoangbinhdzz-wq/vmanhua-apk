name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUNNEL_URL: ${{ secrets.TUNNEL_URL || 'placeholder.trycloudflare.com' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android -keypass android

      - name: Show SHA256 Fingerprint
        run: |
          echo "══════════════════════════════════════"
          echo " SHA256 — paste vào app.py"
          echo "══════════════════════════════════════"
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -storepass android \
            | grep "SHA256:" | sed 's/.*SHA256:/SHA256:/'
          echo "══════════════════════════════════════"

      - name: Setup local PWA server + patch manifest
        run: |
          mkdir -p /tmp/iconserver

          ICON_URL=$(python3 -c "
          import json
          with open('twa-manifest.json') as f:
              m = json.load(f)
          url = (m.get('iconUrl')
              or m.get('maskableIconUrl')
              or next((i['src'] for i in m.get('icons', [])), ''))
          print(url)
          " 2>/dev/null || echo "")

          echo "Icon URL gốc: $ICON_URL"

          if [ -n "$ICON_URL" ] && curl -sf --connect-timeout 8 --max-time 15 "$ICON_URL" -o /tmp/iconserver/icon-512.png 2>/dev/null; then
            echo "Icon tải thành công"
          else
            echo "Tạo icon placeholder 512x512..."
            python3 -c "
          import struct, zlib
          def make_png(w, h, r, g, b):
              raw = b''.join(bytes([0]) + bytes([r, g, b] * w) for _ in range(h))
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw, 1))
              iend = chunk(b'IEND', b'')
              return b'\x89PNG\r\n\x1a\n' + ihdr + idat + iend
          with open('/tmp/iconserver/icon-512.png', 'wb') as f:
              f.write(make_png(512, 512, 79, 70, 229))
          print('Placeholder icon created')
          "
          fi

          python3 - << 'PYEOF'
          import json

          with open('twa-manifest.json') as f:
              m = json.load(f)

          web_manifest = {
              "name":             m.get('name', 'VManhua'),
              "short_name":       m.get('shortName', m.get('name', 'VManhua')),
              "start_url":        m.get('startUrl', '/'),
              "display":          "standalone",
              "theme_color":      m.get('themeColor', '#1e1e2e'),
              "background_color": m.get('backgroundColor', '#1e1e2e'),
              "icons": [
                  {
                      "src": "http://localhost:8899/icon-512.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "any maskable"
                  }
              ]
          }

          with open('/tmp/iconserver/manifest.json', 'w') as f:
              json.dump(web_manifest, f, indent=2)

          print("Web manifest created:")
          print(json.dumps(web_manifest, indent=2))
          PYEOF

          cd /tmp/iconserver && python3 -m http.server 8899 &
          sleep 2
          echo "=== Kiểm tra local server ==="
          curl -s -o /dev/null -w "icon: %{http_code}\n"    http://localhost:8899/icon-512.png
          curl -s -o /dev/null -w "manifest: %{http_code}\n" http://localhost:8899/manifest.json

          python3 - << 'PYEOF'
          import json, os

          ks   = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'
          host = os.environ.get('TUNNEL_URL', 'placeholder.trycloudflare.com')
          LOCAL_ICON     = 'http://localhost:8899/icon-512.png'
          LOCAL_MANIFEST = 'http://localhost:8899/manifest.json'

          with open('twa-manifest.json') as f:
              m = json.load(f)

          m['host']                = host
          m['fullScopeUrl']        = f'https://{host}/'
          m['signingKey']          = {'path': ks, 'alias': 'android'}
          m['appVersionCode']      = 1
          m['appVersionName']      = '1.0.0'
          m['enableNotifications'] = False   # FIX: missing → Groovy syntax error
          if 'startUrl' not in m:
              m['startUrl'] = m.get('launchUrl', '/')

          m['webManifestUrl'] = LOCAL_MANIFEST

          for key in ['iconUrl', 'maskableIconUrl', 'monochromeIconUrl']:
              if key in m:
                  m[key] = LOCAL_ICON

          for icon in m.get('icons', []):
              icon['src'] = LOCAL_ICON

          for shortcut in m.get('shortcuts', []):
              for icon in shortcut.get('icons', []):
                  icon['src'] = LOCAL_ICON

          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)

          print(f"host:           {host}")
          print(f"webManifestUrl: {LOCAL_MANIFEST}")
          print(f"iconUrl:        {LOCAL_ICON}")
          print("Patch hoàn tất")
          PYEOF

      - name: Write build script
        run: |
          cat > build.py << 'PYEOF'
          import pexpect, sys, os

          KS = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'

          child = pexpect.spawn(
              'bubblewrap build --skipPwaValidation',
              timeout=60, encoding='utf-8'
          )
          # Log only what child sends, not what we send — avoids echo spam
          child.logfile_read = sys.stdout

          def send(prompt_pattern, response, label=''):
              print(f'\n[waiting: {label or prompt_pattern}]', flush=True)
              child.expect(prompt_pattern, timeout=60)
              print(f'[matched] → sending: {response!r}', flush=True)
              child.sendline(response)

          print('\n[Phase 1: answering prompts — sequential]\n', flush=True)

          # Sequential: each prompt fires exactly once, no re-match possible
          send('regenerate',                 'y',       'regenerate?')
          send('Key Store Location',         KS,        'keystore path')
          send('Password for the Key Store', 'android', 'keystore pass')
          send('Key Alias',                  'android', 'key alias')
          send('Key Password',               'android', 'key pass')
          send(r'[Vv]ersion[Nn]ame',         '1.0.0',   'version name')
          send(r'[Vv]ersion[Cc]ode',         '1',       'version code')

          print('\n[Phase 2: waiting for Gradle, max 10 min]\n', flush=True)
          try:
              idx = child.expect(
                  ['BUILD SUCCESSFUL', 'BUILD FAILED', pexpect.EOF],
                  timeout=600
              )
              labels = ['BUILD SUCCESSFUL', 'BUILD FAILED', 'EOF']
              print(f'\n{labels[idx]}\n', flush=True)
          except pexpect.TIMEOUT:
              print('Gradle timeout', flush=True)
              child.terminate(force=True)

          child.close()
          rc = child.exitstatus if child.exitstatus is not None else 1
          print(f'\nExit code: {rc}\n', flush=True)
          sys.exit(rc)
          PYEOF

      - name: Build APK (với retry nếu lỗi mạng)
        run: |
          pip install pexpect --break-system-packages
          for attempt in 1 2 3; do
            echo "Attempt $attempt / 3"
            python3 build.py && break
            if [ $attempt -lt 3 ]; then
              echo "Thất bại, thử lại sau 30s..."
              sleep 30
            else
              echo "Đã thử 3 lần, vẫn lỗi."
              exit 1
            fi
          done

      - name: Find APK
        if: always()
        run: |
          echo "=== Tìm APK ==="
          find . -name "*.apk" 2>/dev/null | tee /tmp/apk_list.txt
          if [ -s /tmp/apk_list.txt ]; then
            echo "Tìm thấy APK!"
          else
            echo "Không thấy APK"
            find . -name "gradlew" -o -name "*.aab" 2>/dev/null | head -20
            ls -la app/build/outputs/ 2>/dev/null || true
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
