name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tunnel_url:
        description: 'URL tunnel (không có https://)'
        required: false
        default: 'placeholder.trycloudflare.com'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUNNEL_URL: ${{ secrets.TUNNEL_URL || github.event.inputs.tunnel_url || 'placeholder.trycloudflare.com' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VManhua,O=VManhua,C=VN" \
            -storepass android -keypass android

      - name: Show SHA256 Fingerprint
        run: |
          echo "══════════════════════════════════════"
          echo " SHA256 — paste vào app.py (TWA_FINGERPRINT)"
          echo "══════════════════════════════════════"
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/android.keystore" \
            -alias android -storepass android \
            | grep "SHA256:" | sed 's/.*SHA256:/SHA256:/'
          echo "══════════════════════════════════════"

      - name: Patch twa-manifest.json
        run: |
          python3 - << 'EOF'
          import json, os
          ks   = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'
          host = os.environ.get('TUNNEL_URL', 'placeholder.trycloudflare.com')
          with open('twa-manifest.json') as f:
              m = json.load(f)
          m['host']           = host
          m['webManifestUrl'] = f'https://{host}/manifest.json'
          m['fullScopeUrl']   = f'https://{host}/'
          m['signingKey']     = {'path': ks, 'alias': 'android'}
          if 'startUrl' not in m:
              m['startUrl'] = m.get('launchUrl', '/')
          with open('twa-manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print(f"host: {host}")
          print(f"startUrl: {m['startUrl']}")
          print(f"signingKey: {m['signingKey']}")
          EOF

      - name: Write build script
        run: |
          cat > build.py << 'PYEOF'
          import pexpect, sys, os

          KS = os.environ['GITHUB_WORKSPACE'] + '/android.keystore'

          child = pexpect.spawn(
              'bubblewrap build --skipPwaValidation',
              timeout=60, encoding='utf-8'
          )
          child.logfile = sys.stdout

          PATTERNS = [
              'regenerate',         # 0
              r'\[Y/n\]',           # 1
              r'\(Y/n\)',            # 2
              'Key Store Location',  # 3
              'Key Store Password',  # 4
              'Key Alias',           # 5
              'Key Password',        # 6
              'BUILD SUCCESSFUL',    # 7
              'BUILD FAILED',        # 8
              pexpect.EOF,           # 9
              pexpect.TIMEOUT,       # 10
          ]

          # Phase 1: Trả lời prompt (60s mỗi prompt)
          print('\n[Phase 1: answering prompts]\n', flush=True)
          while True:
              i = child.expect(PATTERNS, timeout=60)
              print(f'\n[match:{i}]\n', flush=True)
              if   i == 0: child.sendline('y')
              elif i in (1, 2): child.sendline('y')
              elif i == 3: child.sendline(KS)
              elif i == 4: child.sendline('android')
              elif i == 5: child.sendline('android')
              elif i == 6: child.sendline('android')
              elif i == 7:
                  print('BUILD SUCCESSFUL (phase 1)', flush=True); break
              elif i == 8:
                  print('BUILD FAILED (phase 1)', flush=True); break
              elif i == 9:
                  print('EOF', flush=True); break
              elif i == 10:
                  # Gradle bắt đầu chạy → chuyển phase 2
                  print('[→ Phase 2: Gradle running]', flush=True); break

          # Phase 2: Chờ Gradle xong (tối đa 10 phút)
          if child.isalive():
              print('\n[Phase 2: waiting for Gradle, max 10 min]\n', flush=True)
              try:
                  idx = child.expect(
                      ['BUILD SUCCESSFUL', 'BUILD FAILED', pexpect.EOF],
                      timeout=600
                  )
                  msgs = ['BUILD SUCCESSFUL', 'BUILD FAILED', 'EOF']
                  print(f'Gradle result: {msgs[idx]}', flush=True)
              except pexpect.TIMEOUT:
                  print('TIMEOUT after 10 min', flush=True)
                  child.terminate(force=True)

          child.close()
          rc = child.exitstatus
          if rc is None:
              print('Process killed — treating as error', flush=True)
              rc = 1
          print(f'Exit code: {rc}', flush=True)
          sys.exit(rc)
          PYEOF

      - name: Build APK
        run: |
          pip install pexpect --break-system-packages
          python3 build.py

      - name: Find APK (debug)
        if: always()
        run: |
          echo "=== Tìm APK ==="
          find . -name "*.apk" 2>/dev/null && echo "✅ Tìm thấy APK" || echo "❌ Không thấy APK"
          echo ""
          echo "=== Cấu trúc thư mục sau build ==="
          find . -name "*.apk" -o -name "*.aab" -o -name "gradlew" 2>/dev/null | head -30
          echo ""
          echo "=== app/build/outputs nếu có ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "(không có thư mục này)"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmanhua-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
